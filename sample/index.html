<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Delegation Test</title>

  <!-- jQuery CDN -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f5f5f5;
    }

    h2 {
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    #addBtn {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    #addBtn:hover {
      background: #0056b3;
    }

    #list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item {
      padding: 15px;
      background: #e9f3ff;
      border: 2px solid #b6d4fe;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .item:hover {
      background: #d0e7ff;
    }

    .active {
      background: #d4edda !important;
      border-color: #28a745 !important;
    }

    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Event Delegation Demo</h2>

    <button id="addBtn">Add New Item</button>

    <div id="list">
      <div class="item">Item 1</div>
      <div class="item">Item 2</div>
      <div class="item">Item 3</div>
    </div>

    <p class="note">Click any item to highlight it. Newly added items will also work.</p>
  </div>

  <script>
    $(document).ready(function () {
      let count = 3;

      $("#addBtn").click(function () {
        count++;
        $("#list").append('<div class="item">Item ' + count + '</div>');
      });

      $("#list").on("click", ".item", function () {
        $(this).toggleClass("active");
      });
    });
  </script>

</body>
</html>
